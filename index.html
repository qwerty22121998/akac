<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Link preview (Instagram/Messenger read these, not the page). og:image must be an absolute URL. -->
  <title>Make file flower in Photoshop</title>
  <meta name="description" content="Step-by-step tutorial for beginners, 5 minutes.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Make file flower in Photoshop">
  <meta property="og:description" content="Step-by-step tutorial for beginners, 5 minutes.">
  <meta property="og:url" content="https://qwerty22121998.github.io/akac/">
  <meta property="og:image" content="https://qwerty22121998.github.io/akac/img/preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 16px;
      box-sizing: border-box;
      background: #111;
      color: #fff;
      font-family: system-ui, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 12vw, 7rem);
      text-transform: uppercase;
      color: #ffde00;
      text-shadow: 4px 4px 0 #e00;
      animation: shake .4s infinite;
    }
    video {
      max-width: 100%;
      max-height: 60vh;
      border-radius: 12px;
    }
    .poop {
      position: fixed;
      top: -2em;
      font-size: 2rem;
      pointer-events: none;
      animation: fall linear forwards;
    }
    @keyframes shake {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    @keyframes fall {
      to { transform: translateY(calc(100vh + 4em)) rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      h1 { animation: none; }
    }
  </style>
</head>
<body>
  <h1>akac an cut</h1>
  <!-- ponytail: mp4 is 184K vs 14.8M gif; same look, autoplay loop -->
  <video src="img/akac.mp4" autoplay loop muted playsinline aria-label="akac"></video>

  <script>
    // Falling poop
    setInterval(() => {
      const p = document.createElement('span');
      p.className = 'poop';
      p.textContent = '💩';
      p.style.left = Math.random() * 92 + 'vw';
      p.style.animationDuration = 2 + Math.random() * 3 + 's';
      p.onanimationend = () => p.remove();
      document.body.append(p);
    }, 300);

    // Blinking tab title
    const titles = ['akac an cut', '(1) Tin nhắn mới'];
    let i = 0;
    setInterval(() => document.title = titles[++i % 2], 1000);
  </script>
</body>
</html>
